<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>شبكة سلاسل الإمداد — خريطة الدريس التفاعلية</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ground:#0B1512; --stage:#0A1310; --panel:#101E19; --panel-2:#14241E;
  --line:#22362F; --line-2:#1A2A24;
  --ink:#EAF2EE; --ink-2:#A8BCB4; --ink-3:#6E837B;
  --brand:#1FA8DE; --hub:#12B48F; --hub-ring:rgba(18,180,143,.22);
  --fixed:#13B892; --temp:#E0A63C; --oper:#5E86A6; --store:#3E86E0; --maint:#E4566A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 50px rgba(0,0,0,.55);
  --f:"SF Arabic","Noto Kufi Arabic","Segoe UI","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
  --rail:352px;
}
:root[data-theme="light"]{
  --ground:#E7ECE9; --stage:#EEF2F0; --panel:#FFFFFF; --panel-2:#F5F8F6;
  --line:#DDE5E1; --line-2:#EAF0ED; --ink:#122019; --ink-2:#40564D; --ink-3:#7A8E85;
  --hub-ring:rgba(14,107,90,.16); --shadow:0 1px 2px rgba(18,33,29,.06),0 16px 40px rgba(18,33,29,.12);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ground:#E7ECE9; --stage:#EEF2F0; --panel:#FFFFFF; --panel-2:#F5F8F6;
    --line:#DDE5E1; --line-2:#EAF0ED; --ink:#122019; --ink-2:#40564D; --ink-3:#7A8E85;
    --hub-ring:rgba(14,107,90,.16); --shadow:0 1px 2px rgba(18,33,29,.06),0 16px 40px rgba(18,33,29,.12);
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--f);background:var(--ground);color:var(--ink);direction:rtl;overflow:hidden;
  -webkit-font-smoothing:antialiased;display:grid;grid-template-rows:auto 1fr;height:100vh}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
::selection{background:rgba(31,168,222,.28)}

/* top bar */
.topbar{display:flex;align-items:center;gap:16px;padding:11px 18px;background:var(--panel);
  border-bottom:1px solid var(--line);position:relative;z-index:1000}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;
  background:radial-gradient(120% 120% at 30% 20%,var(--hub),#0A5C4A);box-shadow:0 4px 14px rgba(14,107,90,.4)}
.mark svg{width:22px;height:22px}
.brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.2px;line-height:1.15;white-space:nowrap}
.brand .sub{font-size:11px;color:var(--ink-3);white-space:nowrap}
.prov{display:flex;align-items:center;gap:7px 13px;flex-wrap:wrap;margin-inline-start:auto;
  font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.prov .sep{width:1px;height:12px;background:var(--line)}
.prov b{color:var(--ink-2);font-weight:600}
.verified{display:inline-flex;align-items:center;gap:5px;color:var(--hub);font-weight:700}
.verified svg{width:13px;height:13px}
.tbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);
  border:1px solid var(--line);background:var(--panel-2);transition:.15s}
.tbtn:hover{color:var(--ink);border-color:var(--hub)}
.tbtn svg{width:17px;height:17px}
.tbtn:focus-visible,.chip:focus-visible,.hubbar li:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.wrap{position:relative;display:grid;grid-template-columns:1fr var(--rail);min-height:0}
.stage{position:relative;background:var(--stage);overflow:hidden}
#map{position:absolute;inset:0}

/* Leaflet theming */
.leaflet-container{background:var(--stage);font-family:var(--f);outline:none}
.leaflet-tile-pane{filter:none}
.leaflet-bar,.leaflet-control-zoom{display:none}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 78%,transparent)!important;color:var(--ink-3)!important;
  font-size:9px!important;border-radius:6px 0 0 0;backdrop-filter:blur(4px)}
.leaflet-control-attribution a{color:var(--ink-2)!important}
.leaflet-popup-content-wrap{background:var(--panel);color:var(--ink);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.leaflet-popup-tip{background:var(--panel);border:1px solid var(--line)}
.leaflet-popup-content{margin:11px 13px;font-size:12.5px;line-height:1.7}
.leaflet-popup-content b{font-weight:700}
.leaflet-popup-close-button{color:var(--ink-3)!important}

/* markers */
path.stn{stroke:var(--stage)}
.hubm{display:grid;place-items:center}
.hubm .ring{position:absolute;border-radius:50%;background:var(--hub-ring);animation:pulse 3.2s ease-out infinite}
.hubm .dm{background:var(--hub);border:2px solid var(--stage);border-radius:3px 3px 3px 0;transform:rotate(45deg);
  box-shadow:0 2px 8px rgba(10,92,74,.5)}
@keyframes pulse{0%{opacity:.55;transform:scale(1)}70%{opacity:0;transform:scale(2.5)}100%{opacity:0;transform:scale(2.5)}}
.leaflet-tooltip.hublbl{background:transparent;border:0;box-shadow:none;padding:0;
  color:var(--ink);font-size:10px;font-weight:700;white-space:nowrap;font-family:var(--f);
  text-shadow:0 0 4px var(--stage),0 0 4px var(--stage),0 0 3px var(--stage),0 0 2px var(--stage)}
.leaflet-tooltip.hublbl::before{display:none}
.flow{stroke-dasharray:4 8;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){.hubm .ring,.flow{animation:none!important}}

/* overlays */
.zoom{position:absolute;inset-block-start:14px;inset-inline-start:14px;display:flex;flex-direction:column;gap:1px;
  border-radius:11px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);z-index:600}
.zoom button{width:36px;height:36px;background:var(--panel);color:var(--ink-2);display:grid;place-items:center;font-size:18px}
.zoom button:hover{background:var(--panel-2);color:var(--ink)}
.zoom button+button{border-top:1px solid var(--line)}
.satbtn{position:absolute;inset-block-start:14px;inset-inline-end:14px;z-index:600}
.hint{position:absolute;inset-block-end:14px;inset-inline-start:14px;font-size:10.5px;color:var(--ink-3);
  background:color-mix(in srgb,var(--panel) 82%,transparent);border:1px solid var(--line);border-radius:20px;padding:5px 12px;z-index:600;backdrop-filter:blur(4px)}
.legend{position:absolute;inset-block-end:52px;inset-inline-start:14px;background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:13px;padding:11px 13px;box-shadow:var(--shadow);z-index:600;max-width:230px}
.legend h4{margin:0 0 8px;font-size:10px;font-weight:700;letter-spacing:1.4px;color:var(--ink-3);text-transform:uppercase}
.lg{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:2.5px 0;color:var(--ink-2);cursor:pointer;user-select:none}
.lg .dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 18%,transparent)}
.lg.off{opacity:.34}
.lg .cnt{margin-inline-start:auto;font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:10.5px}
.lg.hublg .dm{width:11px;height:11px;flex:none;background:var(--hub);border-radius:2px 2px 2px 0;transform:rotate(45deg)}

/* rail (shared with console) */
.rail{background:var(--panel);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:1000}
.search{padding:14px 16px 10px;border-bottom:1px solid var(--line-2);position:relative}
.search svg{position:absolute;inset-inline-start:26px;inset-block-start:24px;width:15px;height:15px;color:var(--ink-3)}
.search input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 34px 9px 12px;font-size:13px;color:var(--ink);outline:none}
.search input:focus{border-color:var(--brand)}
.railscroll{overflow-y:auto;flex:1;padding:14px 16px 24px}
.railscroll::-webkit-scrollbar{width:9px}.railscroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;border:3px solid var(--panel)}
.sec{margin-bottom:18px}
.sec>.t{font-size:10px;font-weight:700;letter-spacing:1.4px;color:var(--ink-3);text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.sec>.t em{font-style:normal;color:var(--ink-3);opacity:.7;font-weight:500;letter-spacing:0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.kpi{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.kpi b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1}
.kpi small{display:block;margin-top:3px;font-size:10.5px;color:var(--ink-3)}
.kpi .u{color:var(--ink-3);font-size:12px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:11.5px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:var(--panel-2);
  color:var(--ink-2);transition:.14s;display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--ink-3)}
.chip.on{background:color-mix(in srgb,var(--brand) 16%,var(--panel-2));border-color:var(--brand);color:var(--ink)}
.chip .c{width:8px;height:8px;border-radius:50%}
.chip .n{opacity:.6;font-size:10px}
select.pick{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12.5px;color:var(--ink);outline:none}
select.pick:focus{border-color:var(--brand)}
.hubbar{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.hubbar li{display:grid;grid-template-columns:1fr auto;align-items:center;gap:9px;font-size:11.5px;padding:4px 6px;border-radius:8px;cursor:pointer}
.hubbar li:hover{background:var(--panel-2)}
.hubbar li.on{background:color-mix(in srgb,var(--hub) 14%,var(--panel-2))}
.hubbar .nm{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hubbar .tk{grid-column:1/-1;height:5px;background:var(--line-2);border-radius:3px;overflow:hidden}
.hubbar .tk i{display:block;height:100%;background:linear-gradient(90deg,var(--hub),color-mix(in srgb,var(--hub) 55%,var(--brand)));border-radius:3px}
.hubbar .vl{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;font-size:11px}
.detail{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.detail .hd{padding:13px 15px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line)}
.detail .badge{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff;font-variant-numeric:tabular-nums}
.detail .hd .nm{font-weight:700;font-size:14px}
.detail .hd .st{font-size:11px;color:var(--ink-3);margin-top:2px}
.detail dl{margin:0;padding:11px 15px 14px;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:12px}
.detail dt{color:var(--ink-3)}
.detail dd{margin:0;text-align:end;font-weight:500;font-variant-numeric:tabular-nums}
.detail .link{display:block;padding:11px 15px;border-top:1px solid var(--line);font-size:11.5px;color:var(--brand);text-align:center;font-weight:600;text-decoration:none}
.empty{color:var(--ink-3);font-size:12px;text-align:center;padding:26px 12px;line-height:1.7}
.empty svg{width:26px;height:26px;opacity:.5;margin-bottom:8px}
.pending{list-style:none;margin:0;padding:0;max-height:150px;overflow-y:auto}
.pending li{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:5px 2px;border-bottom:1px solid var(--line-2);color:var(--ink-2);font-variant-numeric:tabular-nums}
.pending .st{color:var(--ink-3);font-size:10.5px}
.note{font-size:11px;color:var(--ink-3);background:color-mix(in srgb,var(--temp) 12%,var(--panel-2));
  border:1px solid color-mix(in srgb,var(--temp) 30%,var(--line));border-radius:10px;padding:9px 11px;line-height:1.6;margin-top:9px}

.railToggle{display:none}
@media (max-width:880px){
  .wrap{grid-template-columns:1fr}
  .rail{position:fixed;inset-block:0;inset-inline-end:0;width:min(360px,86vw);transform:translateX(-100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow)}
  body.railopen .rail{transform:none}
  .railToggle{display:grid}
  .legend{max-width:170px}
}
</style>
</head>

  <aside class="rail">

  </aside>
</div>

const tiles={
  dark:L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap &copy; CARTO'}),
  light:L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap &copy; CARTO'}),
  sat:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'&copy; Esri'}),
  satlbl:L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png',{maxZoom:20,opacity:.9}),
};
let satOn=false;
function curTheme(){return document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function applyBase(){
  [tiles.dark,tiles.light,tiles.sat,tiles.satlbl].forEach(t=>map.removeLayer(t));
  if(satOn){tiles.sat.addTo(map);tiles.satlbl.addTo(map);}
  else tiles[curTheme()].addTo(map);
}
applyBase();

const linkLayer=L.layerGroup().addTo(map);
const stnLayer=L.layerGroup().addTo(map);
const hubLayer=L.layerGroup().addTo(map);

/* ---- hubs ---- */
const maxLoad=Math.max(...hubs.map(h=>h.load),1);
const hubEls={};
hubs.forEach(h=>{
  if(h.load===0) return;
  const r=Math.round(13+(h.load/maxLoad)*15);
  const icon=L.divIcon({className:'',iconSize:[r,r],iconAnchor:[r/2,r/2],
    html:`<div class="hubm" style="width:${r}px;height:${r}px">
      <span class="ring" style="width:${r}px;height:${r}px"></span>
      <span class="dm" style="width:${Math.round(r*.62)}px;height:${Math.round(r*.62)}px"></span></div>`});
  const m=L.marker([h.lat,h.lng],{icon,zIndexOffset:400,keyboard:true,title:h.name}).addTo(hubLayer);
  m.bindTooltip(h.name.replace('أرامكو ',''),{permanent:h.load>=4,direction:'top',offset:[0,-r/2-2],className:'hublbl'});
  m.on('click',()=>selectHub(h.name));
  hubEls[h.name]=m;
});

/* ---- stations + links ---- */
const nodes=[];
located.forEach(s=>{
  const meta=catOf(s), hub=s.hub&&hubByName[s.hub];
  let link=null;
  if(hub){
    link=L.polyline([[s.lat,s.lng],[hub.lat,hub.lng]],{color:meta.c,weight:1.3,opacity:.28,lineCap:'round'}).addTo(linkLayer);
  }
  const m=L.circleMarker([s.lat,s.lng],{radius:6,fillColor:meta.c,weight:1.6,
    fillOpacity:1,className:'stn'}).addTo(stnLayer);
  m.bindTooltip(`${s.code}${s.site?' · '+s.site:''}`,{direction:'top',offset:[0,-4],className:'hublbl'});
  m.on('click',()=>selectNode(s));
  m.on('mouseover',()=>{m.setRadius(8.5);if(link){link.setStyle({opacity:.95,weight:2.2});link._path&&link._path.classList.add('flow')}});
  m.on('mouseout',()=>{m.setRadius(6);if(link&&sel!==s){link.setStyle({opacity:.28,weight:1.3});link._path&&link._path.classList.remove('flow')}});
  nodes.push({s,m,link,meta});
});

/* ---- state/filters ---- */
const state={q:'',cats:new Set(Object.keys(CAT)),proj:'',hub:null};
let sel=null;
function passes(s){
  if(!state.cats.has(s.cat)) return false;
  if(state.proj && s.project!==state.proj) return false;
  if(state.hub && s.hub!==state.hub) return false;
  if(state.q){const q=state.q.trim().toLowerCase();
    if(!((s.code+' '+(s.site||'')+' '+(s.project||'')+' '+(s.hub||'')).toLowerCase().includes(q))) return false;}
  return true;
}
function applyFilters(){
  let vis=0;
  nodes.forEach(n=>{
    const ok=passes(n.s);
    if(ok){if(!stnLayer.hasLayer(n.m))stnLayer.addLayer(n.m);if(n.link&&!linkLayer.hasLayer(n.link))linkLayer.addLayer(n.link);vis++;}
    else{if(stnLayer.hasLayer(n.m))stnLayer.removeLayer(n.m);if(n.link&&linkLayer.hasLayer(n.link))linkLayer.removeLayer(n.link);}
  });
  hubs.forEach(h=>{const el=hubEls[h.name];if(!el)return;
    const dim=state.hub&&state.hub!==h.name;el.setOpacity(dim?.3:1);});
  renderKpis(vis);renderHubbar();
}

/* ---- interactions ---- */
function boundsOf(list){return L.latLngBounds(list.map(x=>[x.lat,x.lng]))}
function selectHub(name){
  state.hub=(state.hub===name)?null:name;
  applyFilters();
  document.querySelectorAll('.hubbar li').forEach(li=>li.classList.toggle('on',li.dataset.h===state.hub));
  if(state.hub){
    const h=hubByName[name], kids=located.filter(s=>s.hub===name);
    map.flyToBounds(boundsOf([h,...kids]).pad(.25),{duration:.6,maxZoom:9});
    detailHub(h);
  }
}
function selectNode(s){
  sel=s;document.body.classList.remove('railopen');
  detailNode(s);
  const hub=s.hub&&hubByName[s.hub];
  map.flyToBounds(boundsOf([s,hub].filter(Boolean)).pad(.6),{duration:.5,maxZoom:11});
  const n=nodes.find(n=>n.s===s);
  if(n&&n.link){n.link.setStyle({opacity:.95,weight:2.4});n.link._path&&n.link._path.classList.add('flow');}
}

/* ---- zoom / base controls ---- */
$('#zin').onclick=()=>map.zoomIn();
$('#zout').onclick=()=>map.zoomOut();
$('#zfit').onclick=()=>{state.hub=null;applyFilters();document.querySelectorAll('.hubbar li').forEach(li=>li.classList.remove('on'));fitAll()};
$('#satBtn').onclick=()=>{satOn=!satOn;$('#satBtn').style.color=satOn?'var(--hub)':'';applyBase()};
function fitAll(){map.flyToBounds(boundsOf(located).pad(.12),{duration:.5})}

/* ---- rail ---- */
function renderKpis(vis){
  const total=DATA.stations.length, fixed=DATA.stations.filter(s=>s.cat==='مواقع ثابتة').length;
  const kmv=DATA.stations.filter(s=>s.km); const avg=kmv.length?Math.round(kmv.reduce((a,s)=>a+s.km,0)/kmv.length):0;
  $('#kpis').innerHTML=[
    ['المحطات',total],['ظاهرة الآن',vis==null?located.length:vis],
    ['مراكز التوزيع',hubs.filter(h=>h.load).length],['متوسط البُعد',avg,'كم'],
    ['ثابتة',fixed],['قيد التخزين/الصيانة',DATA.stored.length],
  ].map(([l,v,u])=>`<div class="kpi"><b>${fmt(v)}${u?` <span class="u">${u}</span>`:''}</b><small>${l}</small></div>`).join('');
}
function renderCats(){
  const counts={};located.forEach(s=>{const k=catOf(s).lbl;counts[k]=(counts[k]||0)+1});
  $('#cats').innerHTML=Object.entries(CAT).filter(([,m])=>counts[m.lbl]).map(([k,m])=>
    `<button class="chip ${state.cats.has(k)?'on':''}" data-cat="${k}"><span class="c" style="background:${m.c}"></span>${m.lbl}<span class="n">${counts[m.lbl]||0}</span></button>`).join('');
  document.querySelectorAll('#cats .chip').forEach(b=>b.onclick=()=>{
    const k=b.dataset.cat;if(state.cats.has(k))state.cats.delete(k);else state.cats.add(k);
    if(state.cats.size===0)Object.keys(CAT).forEach(x=>state.cats.add(x));
    renderCats();renderLegend();applyFilters();
  });
  $('#catHint').textContent=state.cats.size<Object.keys(CAT).length?'مُصفّى':'';
}
function renderProj(){
  const projs=[...new Set(DATA.stations.map(s=>s.project).filter(Boolean))].sort();
  $('#proj').innerHTML='<option value="">كل المشاريع</option>'+projs.map(p=>`<option${p===state.proj?' selected':''}>${p}</option>`).join('');
  $('#proj').onchange=e=>{state.proj=e.target.value;applyFilters()};
}
function renderHubbar(){
  const active={};located.forEach(s=>{if(passes(s)&&s.hub)active[s.hub]=(active[s.hub]||0)+1});
  const sorted=hubs.slice().filter(h=>h.load>0).sort((a,b)=>b.load-a.load);
  const mx=Math.max(...sorted.map(h=>h.load),1);
  $('#hubbar').innerHTML=sorted.map(h=>`
    <li data-h="${h.name}" tabindex="0" class="${state.hub===h.name?'on':''}" role="button" aria-label="${h.name}، ${h.load} محطة">
      <span class="nm">${h.name.replace('أرامكو ','')}</span><span class="vl">${active[h.name]||0}<span style="color:var(--ink-3)">/${h.load}</span></span>
      <span class="tk"><i style="width:${Math.round(h.load/mx*100)}%"></i></span></li>`).join('');
  document.querySelectorAll('#hubbar li').forEach(li=>{
    li.onclick=()=>selectHub(li.dataset.h);
    li.onkeydown=e=>{if(e.key==='Enter')selectHub(li.dataset.h)};
  });
}
function detailNode(s){
  const m=catOf(s);
  const rows=[['التصنيف',m.lbl],['الموقع',s.site||'—'],['المشروع',s.project||'—'],['الحالة',s.status||'—'],
    ['السعة',s.cap?s.cap+' لتر':'—'],['المنتج',[s.p1,s.p2].filter(Boolean).join(' · ')||'—'],
    ['أقرب مركز',s.hub?s.hub.replace('أرامكو ','')+(s.km?` · ${Math.round(s.km)} كم`:''):'—']];
  $('#detail').innerHTML=`<div class="detail"><div class="hd"><div class="badge" style="background:${m.c}">${s.code.slice(-3)}</div>
    <div><div class="nm">محطة ${s.code}</div><div class="st">${s.site||m.lbl}</div></div></div>
    <dl>${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    ${s.link?`<a class="link" href="${s.link}" target="_blank" rel="noopener">فتح الموقع على الخريطة ↗</a>`:''}</div>`;
}
function detailHub(h){
  $('#detail').innerHTML=`<div class="detail"><div class="hd"><div class="badge" style="background:var(--hub);border-radius:11px 11px 11px 2px">${h.load}</div>
    <div><div class="nm">${h.name}</div><div class="st">مركز توزيع أرامكو · ${h.load} محطة مرتبطة</div></div></div>
    <dl><dt>المحطات المرتبطة</dt><dd>${h.load}</dd><dt>الإحداثيات</dt><dd>${h.lat}, ${h.lng}</dd></dl></div>`;
}
function renderLegend(){
  const counts={};located.forEach(s=>{const k=catOf(s).lbl;counts[k]=(counts[k]||0)+1});
  $('#legend').innerHTML=`<h4>الشبكة</h4>`+Object.entries(CAT).filter(([,m])=>counts[m.lbl]).map(([k,m])=>
    `<div class="lg ${state.cats.has(k)?'':'off'}" data-cat="${k}"><span class="dot" style="background:${m.c};color:${m.c}"></span>${m.lbl}<span class="cnt">${counts[m.lbl]||0}</span></div>`).join('')
    +`<div class="lg hublg" style="margin-top:6px;cursor:default"><span class="dm"></span>مركز أرامكو للتوزيع<span class="cnt">${hubs.filter(h=>h.load).length}</span></div>`;
  document.querySelectorAll('#legend .lg[data-cat]').forEach(el=>el.onclick=()=>{
    const k=el.dataset.cat;if(state.cats.has(k))state.cats.delete(k);else state.cats.add(k);
    if(state.cats.size===0)Object.keys(CAT).forEach(x=>state.cats.add(x));
    renderLegend();renderCats();applyFilters();
  });
}
function renderPending(){
  const rows=[...DATA.stored.map(s=>({code:s.code,tag:s.project||s.cat,ok:hasLL(s),st:s.status||s.cat})),
    ...DATA.stations.filter(s=>!hasLL(s)).map(s=>({code:s.code,tag:s.project||'',ok:false,st:'محطة بلا إحداثيات'}))];
  const pend=rows.filter(r=>!r.ok);
  $('#pendHint').textContent=`${rows.length} وحدة · ${pend.length} بانتظار الإحداثيات`;
  $('#pending').innerHTML=rows.map(r=>`<li><span>${r.code}${r.tag?' · '+r.tag:''}</span><span class="st">${r.ok?'محددة ✓':r.st}</span></li>`).join('');
  $('#pendNote').textContent=pend.length?`${pend.length} وحدة لها رابط موقع مختصر فقط دون إحداثيات — بإضافة إحداثياتها تظهر تلقائياً على الخريطة.`:'كل الوحدات محددة الموقع.';
}

/* ---- controls ---- */
$('#q').addEventListener('input',e=>{state.q=e.target.value;applyFilters()});
$('#themeBtn').onclick=()=>{document.documentElement.setAttribute('data-theme',curTheme()==='dark'?'light':'dark');if(!satOn)applyBase()};
$('#railBtn').onclick=()=>document.body.classList.toggle('railopen');

/* ---- boot ---- */
$('#pUpd').textContent=(()=>{try{return new Date(DATA.meta.updated).toLocaleDateString('ar-SA-u-ca-gregory',{year:'numeric',month:'long',day:'numeric'})}catch(e){return DATA.meta.updated}})();
$('#pVer').textContent=DATA.meta.version||'—';
renderKpis(null);renderCats();renderProj();renderHubbar();renderLegend();renderPending();
$('#detail').innerHTML=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>اختر محطة أو مركزاً على الخريطة لعرض تفاصيله</div>`;
applyFilters();
try{map.fitBounds(boundsOf(located).pad(.12))}catch(e){}
</script>
</body>
</html>
