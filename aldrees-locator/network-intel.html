<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>مركز ذكاء الشبكة — سلاسل الإمداد · الدريس</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ground:#0B1512;--stage:#0A1310;--panel:#101E19;--panel-2:#14241E;
  --line:#22362F;--line-2:#1A2A24;--ink:#EAF2EE;--ink-2:#A8BCB4;--ink-3:#6E837B;
  --brand:#1FA8DE;--hub:#12B48F;--hub-ring:rgba(18,180,143,.22);
  --fixed:#13B892;--temp:#E0A63C;--store:#3E86E0;--maint:#E4566A;
  --good:#13B892;--warn:#E0A63C;--crit:#E4566A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 50px rgba(0,0,0,.55);
  --f:"SF Arabic","Noto Kufi Arabic","Segoe UI","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
  --rail:388px;
}
:root[data-theme="light"]{
  --ground:#E7ECE9;--stage:#EDF1EF;--panel:#FFFFFF;--panel-2:#F5F8F6;
  --line:#DDE5E1;--line-2:#EAF0ED;--ink:#122019;--ink-2:#40564D;--ink-3:#7A8E85;
  --hub-ring:rgba(14,107,90,.16);--shadow:0 1px 2px rgba(18,33,29,.06),0 16px 40px rgba(18,33,29,.12);
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --ground:#E7ECE9;--stage:#EDF1EF;--panel:#FFFFFF;--panel-2:#F5F8F6;
  --line:#DDE5E1;--line-2:#EAF0ED;--ink:#122019;--ink-2:#40564D;--ink-3:#7A8E85;
  --hub-ring:rgba(14,107,90,.16);--shadow:0 1px 2px rgba(18,33,29,.06),0 16px 40px rgba(18,33,29,.12);}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--f);background:var(--ground);color:var(--ink);direction:rtl;overflow:hidden;
  -webkit-font-smoothing:antialiased;display:grid;grid-template-rows:auto auto 1fr;height:100vh}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
::selection{background:rgba(31,168,222,.28)}

.topbar{display:flex;align-items:center;gap:16px;padding:11px 18px;background:var(--panel);border-bottom:1px solid var(--line);z-index:1000}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;
  background:radial-gradient(120% 120% at 30% 20%,var(--hub),#0A5C4A);box-shadow:0 4px 14px rgba(14,107,90,.4)}
.mark svg{width:22px;height:22px}
.brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.2px;line-height:1.15;white-space:nowrap}
.brand .sub{font-size:11px;color:var(--ink-3);white-space:nowrap}
.prov{display:flex;align-items:center;gap:7px 13px;flex-wrap:wrap;margin-inline-start:auto;font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.prov .sep{width:1px;height:12px;background:var(--line)}
.prov b{color:var(--ink-2);font-weight:600}
.verified{display:inline-flex;align-items:center;gap:5px;color:var(--hub);font-weight:700}
.verified svg{width:13px;height:13px}
.tbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line);background:var(--panel-2);transition:.15s}
.tbtn:hover{color:var(--ink);border-color:var(--hub)}
.tbtn svg{width:17px;height:17px}
.tbtn:focus-visible,.tab:focus-visible,.rowlink:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* mode tabs */
.tabs{display:flex;gap:4px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;z-index:999}
.tab{display:flex;align-items:center;gap:8px;padding:8px 15px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--ink-3);white-space:nowrap;border:1px solid transparent;transition:.15s}
.tab:hover{color:var(--ink-2);background:var(--panel-2)}
.tab.on{color:var(--ink);background:color-mix(in srgb,var(--brand) 15%,var(--panel-2));border-color:color-mix(in srgb,var(--brand) 45%,transparent)}
.tab svg{width:15px;height:15px}
.tab .b{font-size:10px;background:var(--line);color:var(--ink-2);border-radius:9px;padding:1px 7px;font-variant-numeric:tabular-nums}
.tab.on .b{background:var(--brand);color:#fff}

.wrap{position:relative;display:grid;grid-template-columns:1fr var(--rail);min-height:0}
.stage{position:relative;background:var(--stage);overflow:hidden}
#map{position:absolute;inset:0}
.leaflet-container{background:var(--stage);font-family:var(--f);outline:none}
.leaflet-bar,.leaflet-control-zoom{display:none}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 78%,transparent)!important;color:var(--ink-3)!important;font-size:9px!important;border-radius:6px 0 0 0;backdrop-filter:blur(4px)}
.leaflet-control-attribution a{color:var(--ink-2)!important}
.leaflet-popup-content-wrap{background:var(--panel);color:var(--ink);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.leaflet-popup-tip{background:var(--panel);border:1px solid var(--line)}
.leaflet-popup-content{margin:11px 13px;font-size:12.5px;line-height:1.7}
.leaflet-popup-close-button{color:var(--ink-3)!important}
path.stn{stroke:var(--stage)}
.hubm{display:grid;place-items:center}
.hubm .ring{position:absolute;border-radius:50%;background:var(--hub-ring);animation:pulse 3.2s ease-out infinite}
.hubm .dm{background:var(--hub);border:2px solid var(--stage);border-radius:3px 3px 3px 0;transform:rotate(45deg);box-shadow:0 2px 8px rgba(10,92,74,.5)}
.hubm.over .dm{background:var(--crit)}
.hubm.under .dm{background:var(--good)}
@keyframes pulse{0%{opacity:.5;transform:scale(1)}70%{opacity:0;transform:scale(2.4)}100%{opacity:0;transform:scale(2.4)}}
.depot{display:grid;place-items:center;background:var(--brand);color:#fff;border:2px solid var(--stage);border-radius:9px;font-weight:700;font-size:11px;box-shadow:0 3px 10px rgba(0,0,0,.4);font-variant-numeric:tabular-nums}
.leaflet-tooltip.lbl{background:transparent;border:0;box-shadow:none;padding:0;color:var(--ink);font-size:10px;font-weight:700;white-space:nowrap;font-family:var(--f);
  text-shadow:0 0 4px var(--stage),0 0 4px var(--stage),0 0 3px var(--stage),0 0 2px var(--stage)}
.leaflet-tooltip.lbl::before{display:none}
.flow{stroke-dasharray:4 8;animation:march 1s linear infinite}
.sugg{stroke-dasharray:2 6;animation:march 1.4s linear infinite}
@keyframes march{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){.hubm .ring,.flow,.sugg{animation:none!important}}

.zoom{position:absolute;inset-block-start:14px;inset-inline-start:14px;display:flex;flex-direction:column;gap:1px;border-radius:11px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);z-index:600}
.zoom button{width:36px;height:36px;background:var(--panel);color:var(--ink-2);display:grid;place-items:center;font-size:18px}
.zoom button:hover{background:var(--panel-2);color:var(--ink)}
.zoom button+button{border-top:1px solid var(--line)}
.mlegend{position:absolute;inset-block-end:14px;inset-inline-start:14px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:13px;padding:11px 13px;box-shadow:var(--shadow);z-index:600;max-width:250px}
.mlegend h4{margin:0 0 8px;font-size:10px;font-weight:700;letter-spacing:1.2px;color:var(--ink-3);text-transform:uppercase}
.mlegend .lg{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:2.5px 0;color:var(--ink-2)}
.mlegend .dot{width:11px;height:11px;border-radius:50%;flex:none}
.mlegend .cnt{margin-inline-start:auto;color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:10.5px}
.hint{position:absolute;inset-block-start:14px;inset-inline-end:14px;font-size:10.5px;color:var(--ink-3);background:color-mix(in srgb,var(--panel) 82%,transparent);border:1px solid var(--line);border-radius:20px;padding:5px 12px;z-index:600;backdrop-filter:blur(4px);max-width:44%}

/* rail */
.rail{background:var(--panel);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:1000}
.railscroll{overflow-y:auto;flex:1;padding:16px}
.railscroll::-webkit-scrollbar{width:9px}.railscroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;border:3px solid var(--panel)}
.vhead{margin:0 0 4px;font-size:15px;font-weight:700}
.vsub{margin:0 0 14px;font-size:11.5px;color:var(--ink-3);line-height:1.6}
.sec{margin-bottom:18px}
.sec>.t{font-size:10px;font-weight:700;letter-spacing:1.3px;color:var(--ink-3);text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.sec>.t em{font-style:normal;color:var(--ink-3);opacity:.7;font-weight:500;letter-spacing:0;margin-inline-start:auto}

.insight{display:flex;gap:11px;padding:12px 13px;border-radius:13px;background:var(--panel-2);border:1px solid var(--line);margin-bottom:9px}
.insight .ic{width:34px;height:34px;flex:none;border-radius:9px;display:grid;place-items:center;color:#fff}
.insight .ic svg{width:17px;height:17px}
.insight .tx b{display:block;font-size:13px;font-weight:700;margin-bottom:2px}
.insight .tx span{font-size:11.5px;color:var(--ink-3);line-height:1.55}
.insight.crit{border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.insight.warn{border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.kpi{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.kpi b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1}
.kpi small{display:block;margin-top:3px;font-size:10.5px;color:var(--ink-3)}
.kpi .u{color:var(--ink-3);font-size:11px;font-weight:500}

.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:82px 1fr auto;align-items:center;gap:9px;font-size:11.5px}
.bar .nm{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tk{height:8px;background:var(--line-2);border-radius:5px;overflow:hidden}
.bar .tk i{display:block;height:100%;border-radius:5px;background:var(--hub)}
.bar .vl{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;font-size:11px;min-width:38px;text-align:end}

.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl th{text-align:start;font-size:9.5px;letter-spacing:.5px;color:var(--ink-3);font-weight:600;text-transform:uppercase;padding:0 6px 7px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 6px;border-bottom:1px solid var(--line-2);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.tbl tr.rowlink{cursor:pointer}
.tbl tr.rowlink:hover td{background:var(--panel-2)}
.tbl .code{color:var(--ink);font-weight:600}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:10px;font-weight:600}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.crit{background:color-mix(in srgb,var(--crit) 20%,transparent);color:var(--crit)}
.arrowc{color:var(--brand);font-weight:700}
.rec{background:color-mix(in srgb,var(--brand) 9%,var(--panel-2));border:1px solid color-mix(in srgb,var(--brand) 28%,var(--line));border-radius:11px;padding:11px 13px;font-size:11.5px;color:var(--ink-2);line-height:1.65;margin-top:10px}
.rec b{color:var(--ink)}
.note{font-size:11px;color:var(--ink-3);background:color-mix(in srgb,var(--warn) 12%,var(--panel-2));border:1px solid color-mix(in srgb,var(--warn) 30%,var(--line));border-radius:10px;padding:9px 11px;line-height:1.6;margin-top:10px}
.searchbox{position:relative;margin-bottom:14px}
.searchbox svg{position:absolute;inset-inline-start:11px;inset-block-start:10px;width:15px;height:15px;color:var(--ink-3)}
.searchbox input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 34px 9px 12px;font-size:12.5px;color:var(--ink);outline:none}
.searchbox input:focus{border-color:var(--brand)}

.railToggle{display:none}
@media (max-width:940px){
  .wrap{grid-template-columns:1fr}
  .rail{position:fixed;inset-block:0;inset-inline-end:0;width:min(400px,90vw);transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow)}
  body.railopen .rail{transform:none}
  .railToggle{display:grid}
  .hint{display:none}
}
</style>
</head>

/* ---- helpers for rail ---- */
const insight=(kind,color,icon,title,sub)=>`<div class="insight ${kind}"><div class="ic" style="background:${color}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${icon}"/></svg></div><div class="tx"><b>${title}</b><span>${sub}</span></div></div>`;
const barRow=(nm,val,max,vl,color)=>`<div class="bar"><span class="nm">${nm}</span><span class="tk"><i style="width:${Math.round(val/max*100)}%${color?`;background:${color}`:''}"></i></span><span class="vl">${vl}</span></div>`;
function mlegend(html){$('#mlegend').innerHTML=html}
function hint(t){$('#mapHint').textContent=t}

/* ---- EXEC ---- */
function vExec(){
  drawStations(s=>({color:CATC[s.cat]||'#5E86A6',r:6,lo:.16}));
  drawHubs('exec'); hint('نظرة عامة على الشبكة — كل محطة مربوطة بأقرب مركز توزيع');
  mlegend(`<h4>الشبكة</h4>`+Object.entries(CATC).filter(([k])=>A.byCat[k]).map(([k,c])=>`<div class="lg"><span class="dot" style="background:${c}"></span>${k}<span class="cnt">${A.byCat[k]}</span></div>`).join('')+`<div class="lg"><span class="dot" style="background:var(--hub);border-radius:3px 3px 3px 0"></span>مركز أرامكو<span class="cnt">${A.hubRows.length}</span></div>`);
  map.flyToBounds(boundsOf(LOC).pad(.12),{duration:.4});
  const prodMax=Math.max(...Object.values(A.byProduct));
  $('#rail').innerHTML=`
    <h2 class="vhead">نظرة تنفيذية</h2>
    <p class="vsub">صورة الشبكة وأبرز ما يستدعي القرار الآن.</p>
    <div class="sec"><div class="t">أبرز الرؤى</div>
      ${insight('crit','var(--crit)','M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z',`${A.crit.length} محطات بعيدة جداً عن مركزها`,`أبعدها ${short(A.crit[0].hub)} ${Math.round(A.crit[0].km)}كم — تكلفة نقل مرتفعة تستحق مراجعة التخصيص.`)}
      ${insight('warn','var(--store)','M20 7 9 18l-5-5',`${fmtK(A.idleCap)} لتر سعة عاطلة`,`${A.idle.length} وحدة مخزّنة/صيانة (${A.maint} تحت الصيانة) = رأس مال معطّل قابل لإعادة النشر.`)}
      ${insight('warn','var(--warn)','M12 3v18M5 8l7-5 7 5',`تركّز الأحمال: ${A.top2share}% على مركزين`,`${short(A.hubRows[0].name)} (${A.hubRows[0].load}) و${short(A.hubRows[1].name)} (${A.hubRows[1].load}) — ${A.rebal.length} محطة قابلة لإعادة التوزيع لمراكز أقرب.`)}
    </div>
    <div class="sec"><div class="t">المؤشرات</div><div class="kpis">
      <div class="kpi"><b>${fmt(S.length)}</b><small>إجمالي المحطات</small></div>
      <div class="kpi"><b>${fmtK(A.capTotal)} <span class="u">لتر</span></b><small>السعة الكلية</small></div>
      <div class="kpi"><b>${A.hubRows.length}</b><small>مراكز التوزيع الفاعلة</small></div>
      <div class="kpi"><b>${Math.round(A.far.reduce((a,s)=>a+s.km,0)/A.far.length)} <span class="u">كم</span></b><small>متوسط البُعد عن المركز</small></div>
      <div class="kpi"><b>${A.byCat['مواقع ثابتة']||0}</b><small>مواقع ثابتة</small></div>
      <div class="kpi"><b>${A.idle.length}</b><small>مخزّنة/صيانة</small></div>
    </div></div>
    <div class="sec"><div class="t">توزيع المنتجات <em>عدد المحطات</em></div><div class="bars">
      ${Object.entries(A.byProduct).sort((a,b)=>b[1]-a[1]).map(([p,n])=>barRow(p,n,prodMax,n,'var(--brand)')).join('')}
    </div></div>`;
}

/* ---- COVERAGE ---- */
function vCoverage(){
  drawStations(s=>{const b=band(s.km||0);const col=b==='crit'?'var(--crit)':b==='warn'?'var(--warn)':'var(--good)';
    return {color:getComputedStyle(document.documentElement).getPropertyValue(b==='crit'?'--crit':b==='warn'?'--warn':'--good').trim(),r:5+Math.min(9,(s.km||0)/60),lo:.14};});
  drawHubs('exec'); hint('لون وحجم كل محطة حسب بُعدها عن أقرب مركز — الأحمر = تكلفة لوجستية مرتفعة');
  mlegend(`<h4>البُعد عن المركز</h4>
    <div class="lg"><span class="dot" style="background:var(--good)"></span>قريبة (دون ١٥٠ كم)<span class="cnt">${A.far.length-A.warn.length-A.crit.length}</span></div>
    <div class="lg"><span class="dot" style="background:var(--warn)"></span>متوسطة (١٥٠–٢٥٠ كم)<span class="cnt">${A.warn.length}</span></div>
    <div class="lg"><span class="dot" style="background:var(--crit)"></span>بعيدة (فوق ٢٥٠ كم)<span class="cnt">${A.crit.length}</span></div>`);
  const rmax=Math.max(...A.regionRows.map(r=>r.avg));
  $('#rail').innerHTML=`
    <h2 class="vhead">التغطية والفجوات</h2>
    <p class="vsub">قياس بُعد كل محطة عن أقرب مركز توزيع لكشف المناطق ضعيفة التغطية والمحطات مرتفعة التكلفة.</p>
    <div class="rec"><b>التوصية:</b> ${A.crit.length} محطة تتجاوز ٢٥٠كم عن مركزها، أعلى تركّز في <b>${A.regionRows[0].region}</b> و<b>${A.regionRows[1].region}</b>. يُنصح بإنشاء/تفعيل نقطة إمداد وسيطة أو إعادة ربطها، أو ترشيحها لاستقبال وحدة من المخزون العاطل (انظر «إعادة التوزيع»).</div>
    <div class="sec" style="margin-top:14px"><div class="t">تغطية المناطق <em>أسوأ أولاً</em></div>
      <table class="tbl"><thead><tr><th>المنطقة</th><th>محطات</th><th>متوسط</th><th>أبعد</th></tr></thead><tbody>
      ${A.regionRows.map(r=>`<tr><td style="color:var(--ink);font-weight:600">${r.region}</td><td>${r.n}</td><td><span class="pill ${band(r.avg)}">${r.avg} كم</span></td><td>${r.max}</td></tr>`).join('')}
      </tbody></table></div>
    <div class="sec"><div class="t">أبعد المحطات <em>اضغط للتحديد</em></div>
      <table class="tbl"><thead><tr><th>الكود</th><th>الموقع</th><th>المركز</th><th>البُعد</th></tr></thead><tbody>
      ${A.far.slice(0,12).map(s=>`<tr class="rowlink" data-code="${s.code}"><td class="code">${s.code}</td><td>${s.site||'—'}</td><td>${short(s.hub)}</td><td><span class="pill ${band(s.km)}">${Math.round(s.km)}</span></td></tr>`).join('')}
      </tbody></table></div>`;
  wireRowlinks();
}

/* ---- LOAD ---- */
function vLoad(){
  drawStations(s=>{const cand=A.rebal.find(r=>r.code===s.code);
    return {color:cand?getComputedStyle(document.documentElement).getPropertyValue('--brand').trim():'#5E7168',r:cand?7:5,lo:cand?0:.08,link:false,fo:cand?1:.5};});
  drawHubs('load'); hint('المراكز الحمراء مثقلة والخضراء منخفضة — الخطوط المتقطّعة اقتراحات نقل لمركز أقرب');
  // suggestion arrows
  A.rebal.forEach(s=>{const h2=hubBy[s.hub2];if(h2){const p=L.polyline([[s.lat,s.lng],[h2.lat,h2.lng]],{color:getComputedStyle(document.documentElement).getPropertyValue('--brand').trim(),weight:1.6,opacity:.7,dashArray:'2 6'}).addTo(L_extra);p._path&&p._path.classList.add('sugg');}});
  mlegend(`<h4>حِمل المراكز</h4>
    <div class="lg"><span class="dot" style="background:var(--crit);border-radius:3px 3px 3px 0"></span>مثقل (٨ محطات فأكثر)</div>
    <div class="lg"><span class="dot" style="background:var(--hub);border-radius:3px 3px 3px 0"></span>متوازن</div>
    <div class="lg"><span class="dot" style="background:var(--good);border-radius:3px 3px 3px 0"></span>منخفض (٤ فأقل)</div>
    <div class="lg"><span class="dot" style="background:var(--brand)"></span>محطة مرشّحة للنقل<span class="cnt">${A.rebal.length}</span></div>`);
  const lmax=A.hubRows[0].load;
  $('#rail').innerHTML=`
    <h2 class="vhead">موازنة الأحمال</h2>
    <p class="vsub">${A.top2share}% من الشبكة على مركزين فقط. الأداة ترشّح محطات قرب مركز مثقل يمكن ربطها بمركز أخفّ بفارق مسافة بسيط.</p>
    <div class="rec"><b>التوصية:</b> نقل <b>${A.rebal.length} محطة</b> إلى أقرب مركز أخفّ يخفّف الضغط عن ${short(A.hubRows[0].name)} و${short(A.hubRows[1].name)} بمتوسط فارق <b>${Math.round(A.rebal.reduce((a,s)=>a+s.extra,0)/(A.rebal.length||1))}كم</b> فقط لكل محطة.</div>
    <div class="sec" style="margin-top:14px"><div class="t">حِمل المراكز <em>محطة</em></div><div class="bars">
      ${A.hubRows.map(h=>barRow(short(h.name),h.load,lmax,h.load,h.load>=8?'var(--crit)':h.load<=4?'var(--good)':'var(--hub)')).join('')}
    </div></div>
    <div class="sec"><div class="t">مرشّحات إعادة الربط <em>اضغط للتحديد</em></div>
      <table class="tbl"><thead><tr><th>محطة</th><th>من (حمل)</th><th></th><th>إلى (حمل)</th><th>+كم</th></tr></thead><tbody>
      ${A.rebal.map(s=>`<tr class="rowlink" data-code="${s.code}"><td class="code">${s.code}</td><td>${short(s.hub)} <span style="color:var(--crit)">${load[s.hub]}</span></td><td class="arrowc">←</td><td>${short(s.hub2)} <span style="color:var(--good)">${load[s.hub2]}</span></td><td><span class="pill good">+${s.extra}</span></td></tr>`).join('')}
      </tbody></table></div>`;
  wireRowlinks();
}

/* ---- REDEPLOY ---- */
function vRedeploy(){
  drawStations(s=>({color:'#5E7168',r:4,lo:.06,link:false,fo:.4}));
  drawHubs('exec'); hint('المستودعات (أزرق) فيها وحدات عاطلة — الأسهم تقترح أقرب منطقة ذات فجوة تغطية');
  // depot markers + arrows to target gap region
  A.redeploy.forEach(d=>{
    if(!d.coords)return;
    const size=Math.round(20+d.count*1.6);
    L.marker(d.coords,{icon:L.divIcon({className:'',iconSize:[size,size],iconAnchor:[size/2,size/2],html:`<div class="depot" style="width:${size}px;height:${size}px">${d.count}</div>`}),zIndexOffset:500})
      .addTo(L_extra).bindTooltip(d.depot+` · ${d.count} عاطلة`,{direction:'top',offset:[0,-size/2],className:'lbl'});
    if(d.target){const p=L.polyline([d.coords,[d.target.lat,d.target.lng]],{color:getComputedStyle(document.documentElement).getPropertyValue('--brand').trim(),weight:2,opacity:.75,dashArray:'2 6'}).addTo(L_extra);p._path&&p._path.classList.add('sugg');}
  });
  mlegend(`<h4>إعادة التوزيع</h4>
    <div class="lg"><span class="dot" style="background:var(--brand);border-radius:4px"></span>مستودع فيه وحدات عاطلة</div>
    <div class="lg"><span class="dot" style="background:var(--brand)"></span>سهم → منطقة فجوة مقترحة</div>`);
  const dmax=Math.max(...Object.values(A.idleByDepot));
  $('#rail').innerHTML=`
    <h2 class="vhead">إعادة توزيع الأصول العاطلة</h2>
    <p class="vsub">${A.idle.length} وحدة مخزّنة/صيانة (${fmtK(A.idleCap)} لتر) موزّعة على ${Object.keys(A.idleByDepot).length} مستودعات — أصل معطّل يمكن نشره حيث التغطية أضعف.</p>
    <div class="sec"><div class="t">المؤشرات</div><div class="kpis">
      <div class="kpi"><b>${A.idle.length}</b><small>وحدات عاطلة</small></div>
      <div class="kpi"><b>${fmtK(A.idleCap)} <span class="u">لتر</span></b><small>سعة معطّلة</small></div>
      <div class="kpi"><b>${A.maint}</b><small>تحت الصيانة</small></div>
      <div class="kpi"><b>${A.idle.length-A.maint}</b><small>جاهزة للنشر</small></div>
    </div></div>
    <div class="sec"><div class="t">المخزون حسب المستودع</div><div class="bars">
      ${Object.entries(A.idleByDepot).sort((a,b)=>b[1]-a[1]).map(([d,n])=>barRow(d.replace('نقليات ','').replace('مصنع ',''),n,dmax,n,'var(--store)')).join('')}
    </div></div>
    <div class="sec"><div class="t">خطة إعادة النشر المقترحة</div>
      <table class="tbl"><thead><tr><th>المستودع</th><th>عاطلة</th><th>المنطقة الهدف</th><th>فجوة</th></tr></thead><tbody>
      ${A.redeploy.map(d=>`<tr><td style="color:var(--ink);font-weight:600">${d.depot.replace('نقليات ','')}</td><td>${d.count}</td><td>${d.target?d.target.region+` <span style="color:var(--ink-3)">(${d.target.d?Math.round(d.target.d)+'كم':''})</span>`:'—'}</td><td>${d.target?`<span class="pill ${band(d.target.avg)}">${d.target.avg}كم</span>`:'—'}</td></tr>`).join('')}
      </tbody></table>
      <div class="note">الترشيح آليّ حسب أقرب منطقة ذات متوسط بُعد مرتفع لكل مستودع؛ القرار النهائي يراعي الطلب الفعلي وجاهزية الوحدة. الوحدات بلا إحداثيات مُجمّعة عند مستودعها.</div>
    </div>`;
}

function wireRowlinks(){document.querySelectorAll('.rowlink').forEach(r=>r.onclick=()=>focusStation(r.dataset.code))}

/* ---- controls ---- */
$('#zin').onclick=()=>map.zoomIn(); $('#zout').onclick=()=>map.zoomOut();
$('#zfit').onclick=()=>map.flyToBounds(boundsOf(LOC).pad(.12),{duration:.4});
$('#themeBtn').onclick=()=>{document.documentElement.setAttribute('data-theme',curTheme()==='dark'?'light':'dark');applyBase();setMode(mode)};
$('#railBtn').onclick=()=>document.body.classList.toggle('railopen');

/* ---- boot ---- */
$('#pUpd').textContent=(()=>{try{return new Date(DATA.meta.updated).toLocaleDateString('ar-SA-u-ca-gregory',{year:'numeric',month:'long',day:'numeric'})}catch(e){return DATA.meta.updated}})();
$('#pVer').textContent=DATA.meta.version||'—';
renderTabs(); setMode('exec');
try{map.fitBounds(boundsOf(LOC).pad(.12))}catch(e){}
</script>
</body>
</html>
