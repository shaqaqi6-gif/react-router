<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دليل مواقع محطات الدريس · الرد الآلي</title>
<meta name="description" content="بحث مواقع محطات الدريس حسب الرقم أو المدينة أو المنطقة أو الحي أو الشارع أو أقرب مركز أرامكو.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--brand:#1B95D3;--brand-d:#127bb5;--navy:#0A2A3D;--ink:#14303f;--ink2:#51697a;--muted:#88a0b2;
  --bg:#eef3f8;--surface:#fff;--line:#e6eef4;--line2:#d2e0ea;--wash:#eaf6fc;--ok:#12996e;--ok-bg:#e1f6ee;--warn:#e08a1e;--crit:#db2f44;
  --green:#0f7a4d;--r:14px;--ease:cubic-bezier(.23,1,.32,1);--disp:"Readex Pro","Tajawal",sans-serif;--body:"Tajawal",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
.top{background:linear-gradient(120deg,#0A2A3D,#0c5f8c,#1B95D3);color:#fff;padding:20px 22px;box-shadow:0 4px 24px rgba(10,42,61,.18);position:sticky;top:0;z-index:1000}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{background:#fff;border-radius:10px;padding:6px 10px;font-family:var(--disp);font-weight:800;color:var(--brand);font-size:17px;letter-spacing:.5px;flex:none}
.top h1{font-family:var(--disp);font-size:18px;font-weight:700}
.top p{font-size:12px;opacity:.82;margin-top:2px}
.wrap{max-width:1280px;margin:18px auto;padding:0 16px;display:grid;grid-template-columns:1fr 1.05fr;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(10,42,61,.05),0 2px 10px rgba(10,42,61,.05)}
.search{padding:14px}
.sbox{position:relative}
.sbox input{width:100%;border:1.5px solid var(--line2);border-radius:12px;padding:14px 46px 14px 14px;font-family:var(--body);font-size:15px;outline:none;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.sbox input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--wash)}
.sbox .ic{position:absolute;top:50%;right:15px;transform:translateY(-50%);opacity:.5}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.chip{font-family:var(--disp);font-size:12.5px;font-weight:700;color:var(--ink2);background:#fff;border:1px solid var(--line2);border-radius:20px;padding:6px 13px;cursor:pointer;transition:.15s var(--ease)}
.chip:hover{border-color:var(--brand);color:var(--brand-d)}
.chip.on{background:linear-gradient(135deg,#127bb5,#1B95D3);color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(27,149,211,.35)}
.chip:active{transform:scale(.96)}
.stat{padding:2px 16px 10px;font-size:12.5px;color:var(--muted)}
.results{max-height:calc(100vh - 260px);overflow-y:auto;padding:0 12px 14px}
.card{border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px;cursor:pointer;transition:border-color .14s var(--ease),box-shadow .14s var(--ease),transform .14s var(--ease);background:#fff;animation:rise .4s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card:hover{border-color:var(--brand);box-shadow:0 4px 16px rgba(27,149,211,.14)}
.card.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--wash),0 4px 16px rgba(27,149,211,.18)}
.card:active{transform:scale(.995)}
.c-top{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.c-no{font-family:var(--disp);font-weight:800;color:var(--brand-d);font-size:15px}
.c-nm{font-weight:700;color:var(--navy);font-size:14.5px;flex:1}
.c-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px;font-size:12px;color:var(--ink2)}
.c-meta .pill{background:var(--wash);border-radius:20px;padding:2px 9px}
.c-near{margin-top:7px;font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-family:var(--disp);font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px}
.tag.near{background:var(--ok-bg);color:var(--ok)}
.tag.appr{background:#eaf3ff;color:#2a6fd6}
.c-addr{margin-top:6px;font-size:12px;color:var(--muted);min-height:16px}
.c-btns{display:flex;gap:7px;margin-top:10px}
.btn{flex:1;font-family:var(--disp);font-size:12px;font-weight:700;border:1px solid var(--line2);background:#fff;color:var(--navy);border-radius:9px;padding:8px;cursor:pointer;transition:.14s var(--ease);text-decoration:none;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.btn:hover{border-color:var(--brand);background:var(--wash);color:var(--brand-d)}
.btn:active{transform:scale(.97)}
.btn.g{background:linear-gradient(135deg,#0f7a4d,#12a05f);color:#fff;border-color:transparent}
.btn.g:hover{filter:brightness(1.06);color:#fff}
.mapwrap{position:relative;min-height:520px}
#map{width:100%;height:100%;min-height:520px;border-radius:var(--r)}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:13.5px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--wash-2,#d6ecf9);border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{max-width:1280px;margin:0 auto 26px;padding:0 16px;font-size:11.5px;color:var(--muted);text-align:center}
.al-pin{background:none;border:none}.al-pin span{display:block;width:16px;height:16px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--brand);border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.35)}
.ar-pin{background:none;border:none}.ar-pin span{display:block;width:15px;height:15px;border-radius:50%;background:var(--green);border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.35)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(10,42,61,.35);opacity:0;pointer-events:none;transition:.25s var(--ease);z-index:3000}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.mapwrap{min-height:380px;order:-1}#map{min-height:380px}.results{max-height:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.08s!important}.card{animation:none}}
</style>
</head>

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
function hav(a,b,c,d){const R=6371,dl=(c-a)*Math.PI/180,dn=(d-b)*Math.PI/180;const x=Math.sin(dl/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x));}

function initMap(){
  if(typeof L==='undefined'){ document.getElementById('map').innerHTML='<div class="empty">تعذّر تحميل الخريطة — تحقق من الاتصال</div>'; return; }
  map=L.map('map',{zoomControl:true}).setView([24,45],6);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap © CARTO'}).addTo(map);
  cLayer=L.layerGroup().addTo(map);
  Object.entries(CENTER_COORDS).forEach(([nm,ll])=>{
    L.marker(ll,{icon:L.divIcon({className:'ar-pin',html:'<span></span>',iconSize:[15,15],iconAnchor:[7,7]})}).addTo(cLayer).bindTooltip('أرامكو '+nm,{direction:'top'});
  });
  stLayer=L.layerGroup().addTo(map);
}
function search(){
  const raw=$('#q').value.trim(), q=raw.toLowerCase();
  if(mode==='loc'){ locSearch(raw); return; }
  let list=STATIONS;
  if(q){
    if(mode==='no') list=STATIONS.filter(s=>s.s.startsWith(q));
    else if(mode==='city') list=STATIONS.filter(s=>s.c.toLowerCase().includes(q));
    else if(mode==='region') list=STATIONS.filter(s=>s.r.toLowerCase().includes(q));
    else if(mode==='center') list=STATIONS.filter(s=>s.nr.toLowerCase().includes(q)||s.ap.toLowerCase().includes(q));
    else list=STATIONS.filter(s=>(s.s+' '+s.n+' '+s.c+' '+s.r+' '+s.nr).toLowerCase().includes(q));
    list=list.slice().sort((a,b)=>(a.s.startsWith(q)?0:1)-(b.s.startsWith(q)?0:1));
  }
  render(list, raw?'':'أنشط المحطات — اكتب للبحث');
}
async function locSearch(text){
  if(!text){ render([],'اكتب حياً أو شارعاً أو عنواناً — نجيب أقرب المحطات له'); return; }
  $('#stat').innerHTML='<span class="spin"></span> جارٍ تحديد الموقع…';
  try{
    const u='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=sa&accept-language=ar&q='+encodeURIComponent(text);
    const j=await fetch(u,{headers:{'Accept':'application/json'}}).then(r=>r.json());
    if(!j.length){ render([],'لم يُعثر على هذا الموقع — جرّب صياغة أخرى'); return; }
    const la=+j[0].lat, lo=+j[0].lon;
    const near=STATIONS.map(s=>({...s,_d:hav(la,lo,s.la,s.lo)})).sort((a,b)=>a._d-b._d).slice(0,12);
    if(map){map.setView([la,lo],11); L.circleMarker([la,lo],{radius:9,color:'#fff',weight:3,fillColor:'#db2f44',fillOpacity:1}).addTo(stLayer).bindPopup('الموقع المطلوب: '+text);}
    render(near, 'أقرب '+near.length+' محطة لـ «'+text+'»', true);
  }catch(e){ render([],'تعذّر تحديد الموقع (تحقق من الاتصال)'); }
}
function render(list, note, withDist){
  $('#stat').textContent = note || (list.length+' محطة');
  const shown=list.slice(0,60);
  const r=$('#results'); r.innerHTML='';
  if(!shown.length){ r.innerHTML='<div class="empty">لا نتائج مطابقة</div>'; drawStations([]); return; }
  shown.forEach((s,i)=>{
    const c=el('div','card'); c.style.animationDelay=(Math.min(i,10)*28)+'ms'; c.dataset.s=s.s;
    c.innerHTML='<div class="c-top"><span class="c-no">'+s.s+'</span><span class="c-nm">'+s.n+'</span></div>'
      +'<div class="c-meta"><span class="pill">📍 '+(s.c||'—')+'</span><span class="pill">'+(s.r||'')+'</span>'+(withDist&&s._d!=null?'<span class="pill">⇐ '+Math.round(s._d)+' كم</span>':'')+'</div>'
      +'<div class="c-near"><span class="tag near">أقرب مركز</span> أرامكو '+s.nr+' · '+s.nk+'كم'+(s.ap&&s.ap!==s.nr?' <span class="tag appr">معتمد: '+s.ap+'</span>':'')+'</div>'
      +'<div class="c-addr" data-addr="'+s.s+'"></div>'
      +'<div class="c-btns"><button class="btn" data-act="copy">📋 نسخ الرد</button>'
      +'<a class="btn g" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+s.la+','+s.lo+'">🗺️ قوقل</a></div>';
    c.onclick=e=>{ if(e.target.closest('a'))return; if(e.target.dataset.act==='copy'){e.stopPropagation();copyReply(s);return;} select(s,c); };
    r.appendChild(c);
  });
  drawStations(shown);
}
function drawStations(list){
  if(!stLayer) return; stLayer.clearLayers();
  const pts=[];
  list.forEach(s=>{
    const m=L.marker([s.la,s.lo],{icon:L.divIcon({className:'al-pin',html:'<span></span>',iconSize:[16,16],iconAnchor:[8,15]})}).addTo(stLayer);
    m.bindTooltip(s.s+' · '+s.n,{direction:'top'}); m.on('click',()=>select(s));
    pts.push([s.la,s.lo]);
  });
  if(pts.length===1) map.setView(pts[0],12);
  else if(pts.length>1){ try{map.fitBounds(L.latLngBounds(pts),{padding:[40,40],maxZoom:12});}catch(e){} }
}
async function select(s,card){
  curSel=s;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('sel',c.dataset.s===s.s));
  geocode(s);
  if(!map||typeof L==='undefined') return;
  if(selMarker){try{map.removeLayer(selMarker);}catch(e){}}
  selMarker=L.marker([s.la,s.lo],{icon:L.divIcon({className:'al-pin',html:'<span style="width:22px;height:22px"></span>',iconSize:[22,22],iconAnchor:[11,20]}),zIndexOffset:1000}).addTo(map);
  map.setView([s.la,s.lo],14,{animate:true});
  selMarker.bindPopup('<b>'+s.s+' · '+s.n+'</b><br>أقرب: أرامكو '+s.nr+' ('+s.nk+'كم)').openPopup();
}
async function geocode(s){
  const box=document.querySelector('.c-addr[data-addr="'+s.s+'"]');
  if(geoCache[s.s]){ if(box)box.textContent='📌 '+geoCache[s.s]; return geoCache[s.s]; }
  if(box)box.innerHTML='<span class="spin"></span> جارٍ تحديد الحي/الشارع…';
  try{
    const u='https://nominatim.openstreetmap.org/reverse?format=json&zoom=18&accept-language=ar&lat='+s.la+'&lon='+s.lo;
    const j=await fetch(u).then(r=>r.json()); const a=j.address||{};
    const parts=[a.neighbourhood||a.suburb||a.quarter||a.city_district, a.road||a.pedestrian].filter(Boolean);
    const addr=parts.join(' · ')|| j.display_name?.split(',').slice(0,2).join(' · ') || 'غير متوفر';
    geoCache[s.s]=addr; if(box)box.textContent='📌 '+addr; return addr;
  }catch(e){ if(box)box.textContent='📌 تعذّر جلب العنوان'; return ''; }
}
async function copyReply(s){
  const addr=await geocode(s);
  const t='محطة الدريس رقم '+s.s+' — '+s.n+'\\n'
    +'المدينة: '+s.c+' | المنطقة: '+s.r+'\\n'
    +(addr?'الحي/الشارع: '+addr+'\\n':'')
    +'الإحداثيات: '+s.la+', '+s.lo+'\\n'
    +'الموقع: https://www.google.com/maps/search/?api=1&query='+s.la+','+s.lo+'\\n'
    +'أقرب مركز أرامكو: '+s.nr+' ('+s.nk+' كم)'+(s.ap&&s.ap!==s.nr?' | المركز المعتمد: '+s.ap:'');
  try{ await navigator.clipboard.writeText(t); toast('✅ نُسخ رد المحطة '+s.s); }
  catch(e){ toast('تعذّر النسخ'); }
}
$('#q').addEventListener('input',()=>{clearTimeout(window._st);window._st=setTimeout(search,220);});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;mode=b.dataset.m;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));$('#q').placeholder=mode==='loc'?'اكتب حياً أو شارعاً أو عنواناً…':mode==='no'?'رقم المحطة…':mode==='center'?'اسم أقرب مركز…':'اكتب للبحث…';search();});
initMap(); search();
</script>
